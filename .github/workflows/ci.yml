name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      # The causality guarantees are checked against the committed IBKR cache,
      # not only against fixtures: a synthetic test can pass on a store the real
      # ingest never produces.
      - run: python scripts/ingest_ibkr_cache.py
      - run: python scripts/demo_causality.py
      - run: python scripts/reconcile_conventions.py
      # The command a person uses, on the real store: status, and a backtest
      # with its report, recorded to a throwaway ledger.
      - run: ql data status
      - run: ql backtest --report --ledger /tmp/ci-ledger.jsonl
      # The funnel is slow (seventy-five backtests); CI runs a reduced
      # control set so the gates themselves stay exercised on every push.
      - run: python scripts/run_funnel.py --controls 20
