name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      # The steps below need the IBKR price cache, which is not in the
      # repository: its licence forbids redistribution. They run wherever the
      # cache is present (a fork with its own data, or a private data
      # checkout) and are skipped otherwise. Locally, run them by hand: the
      # causality guarantees must be checked against the real ingest, not only
      # against fixtures.
      - if: hashFiles('data/ibkr_cache/weekly/*.csv') != ''
        run: python scripts/ingest_ibkr_cache.py
      - if: hashFiles('data/ibkr_cache/weekly/*.csv') != ''
        run: python scripts/demo_causality.py
      - if: hashFiles('data/ibkr_cache/weekly/*.csv') != ''
        run: python scripts/reconcile_conventions.py
      - if: hashFiles('data/ibkr_cache/weekly/*.csv') != ''
        run: ql data status
      - if: hashFiles('data/ibkr_cache/weekly/*.csv') != ''
        run: ql backtest --report --ledger /tmp/ci-ledger.jsonl
      - if: hashFiles('data/ibkr_cache/weekly/*.csv') != ''
        run: python scripts/run_funnel.py --controls 20
